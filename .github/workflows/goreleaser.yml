name: Release new version

on:
  push:
    tags:
      - "*" # triggers only on a new tag, e.g. `v0.1.0`

# Restrict jobs in this workflow to have no permissions by default; permissions
# should be granted per job as needed using a dedicated `permissions` block
permissions: {}

jobs:
  goreleaser:
    outputs:
      image: ${{ steps.artifacts.outputs.image }}
      digest: ${{ steps.artifacts.outputs.digest }}
    permissions:
      contents: write # for goreleaser/goreleaser-action to create a GitHub release
      packages: write # for goreleaser/goreleaser-action to publish docker images
      id-token: write # for cosign keyless signing and Sigstore certificates
      attestations: write # to persist the artifact attestations
      artifact-metadata: write # to create the attestations' storage records
    runs-on: ubuntu-latest
    env:
      # Required for buildx on docker 19.x
      DOCKER_CLI_EXPERIMENTAL: "enabled"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          check-latest: true
          # Release build: don't restore a potentially-poisoned module/build
          # cache into a published artifact.
          cache: false
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: homebrew-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: think-ahead-technologies
          repositories: homebrew-tap
          # Scope the minted token to only what the tap push needs, instead of
          # inheriting all of the app installation's permissions.
          permission-contents: write
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: scoop-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: think-ahead-technologies
          repositories: scoop-bucket
          permission-contents: write
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: ghcr-login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Detect stable tag
        id: detect_stable
        # Extracts tag name from git ref and checks if it matches the stable
        # semantic version pattern (vMAJOR.MINOR.PATCH, e.g., v1.2.3).
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "STABLE=true" >> $GITHUB_ENV
          else
            echo "STABLE=false" >> $GITHUB_ENV
          fi
      - name: Run GoReleaser
        id: run-goreleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STABLE: ${{ env.STABLE }}
          HOMEBREW_TAP_TOKEN: ${{ steps.homebrew-token.outputs.token }}
          SCOOP_BUCKET_TOKEN: ${{ steps.scoop-token.outputs.token }}
      - name: Locate release artifacts
        id: artifacts
        # All pushed tags of the multi-platform image share one manifest-list
        # digest, so `unique` collapses them to a single attestation subject.
        env:
          ARTIFACTS: "${{ steps.run-goreleaser.outputs.artifacts }}"
        run: |
          set -euo pipefail
          checksums=$(echo "$ARTIFACTS" | jq -re '.[] | select(.type=="Checksum") | .path')
          name=$(echo "$ARTIFACTS" | jq -re '[.[] | select(.type=="Docker Image") | .name | split(":")[0]] | unique | .[0]')
          digest=$(echo "$ARTIFACTS" | jq -re '[.[] | select(.type=="Docker Image") | .extra.Digest] | unique | .[0]')
          echo "checksums=$checksums" >> "$GITHUB_OUTPUT"
          echo "image=$name" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Export the released source tree
        # git archive gives the scanner the tagged source alone — the working
        # tree also holds goreleaser's dist/, whose binaries and archives are
        # release output, not dependencies.
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/src"
          git archive HEAD | tar -x -C "${RUNNER_TEMP}/src"
      - name: Generate source SBOM
        # The released image scans the released source, pinned by the digest
        # this run just published. The mount path names the SBOM's root
        # component, which repo mode takes from the scanned directory.
        # --component-id / --component-version make the serialNumber
        # deterministic, so each release's SBOM is one member of a document
        # series for this component.
        env:
          IMAGE: "${{ steps.artifacts.outputs.image }}@${{ steps.artifacts.outputs.digest }}"
          KUNNUS_COMPONENT_ID: "github.com/${{ github.repository }}"
          KUNNUS_COMPONENT_VERSION: "${{ github.ref_name }}"
          KUNNUS_AUTHOR: "Think Ahead Technologies <kunnus@think-ahead.tech>"
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${RUNNER_TEMP}/src:/kunnus-scanner:ro" -w /kunnus-scanner \
            -e KUNNUS_COMPONENT_ID -e KUNNUS_COMPONENT_VERSION -e KUNNUS_AUTHOR \
            "$IMAGE" sbom repo . > kunnus_sbom.cdx.json
      - name: Sign source SBOM
        run: cosign sign-blob --yes --bundle kunnus_sbom.cdx.json.sigstore.json kunnus_sbom.cdx.json
      - name: Attach SBOM to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" kunnus_sbom.cdx.json kunnus_sbom.cdx.json.sigstore.json
      - name: Collect attestation subjects
        # goreleaser's checksum file covers the archives and the .deb/.rpm
        # packages; the SBOM ships beside them, so it is a subject too. The
        # published checksum file itself is left untouched.
        env:
          CHECKSUMS: ${{ steps.artifacts.outputs.checksums }}
        run: |
          set -euo pipefail
          cp "$CHECKSUMS" subjects.txt
          sha256sum kunnus_sbom.cdx.json >> subjects.txt
      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: subjects.txt
      - name: Attest release SBOM
        # The SBOM describes the source the archives and packages were built
        # from, so they are its subjects.
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ${{ steps.artifacts.outputs.checksums }}
          sbom-path: kunnus_sbom.cdx.json
      - name: Attest container image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.artifacts.outputs.image }}
          subject-digest: ${{ steps.artifacts.outputs.digest }}
          push-to-registry: true
  image-sbom:
    # One SBOM per platform image: the manifest-list members differ in their
    # installed packages, so a single SBOM cannot describe both. Each is
    # attested against the platform digest it describes and pushed to ghcr.
    needs: [goreleaser]
    permissions:
      packages: write # to push the attestation to ghcr.io
      id-token: write # for the Sigstore signing certificate
      attestations: write # to persist the attestation
      artifact-metadata: write # to create the attestation's storage record
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - name: ghcr-login
        # The attestation is pushed to the registry, which needs credentials
        # this job does not inherit from the goreleaser job.
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve platform digest
        id: platform
        env:
          IMAGE: "${{ needs.goreleaser.outputs.image }}@${{ needs.goreleaser.outputs.digest }}"
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          digest=$(docker buildx imagetools inspect "$IMAGE" --raw \
            | jq -re --arg p "$PLATFORM" '.manifests[] | select(.platform.os + "/" + .platform.architecture == $p) | .digest')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "slug=${PLATFORM/\//-}" >> "$GITHUB_OUTPUT"
      - name: Generate image SBOM
        # The scanner reads the platform image straight from the registry
        # (public, so no credentials). The platform is part of the component
        # id: the two images are separate document series.
        env:
          SCANNER: "${{ needs.goreleaser.outputs.image }}@${{ needs.goreleaser.outputs.digest }}"
          TARGET: "${{ needs.goreleaser.outputs.image }}@${{ steps.platform.outputs.digest }}"
          KUNNUS_COMPONENT_ID: "${{ needs.goreleaser.outputs.image }}@${{ matrix.platform }}"
          KUNNUS_COMPONENT_VERSION: "${{ github.ref_name }}"
          KUNNUS_AUTHOR: "Think Ahead Technologies <kunnus@think-ahead.tech>"
          SLUG: ${{ steps.platform.outputs.slug }}
        run: |
          set -euo pipefail
          docker run --rm \
            -e KUNNUS_COMPONENT_ID -e KUNNUS_COMPONENT_VERSION -e KUNNUS_AUTHOR \
            "$SCANNER" sbom container --source remote "$TARGET" \
            > "kunnus_sbom_image_${SLUG}.cdx.json"
      - name: Attest image SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ needs.goreleaser.outputs.image }}
          subject-digest: ${{ steps.platform.outputs.digest }}
          sbom-path: kunnus_sbom_image_${{ steps.platform.outputs.slug }}.cdx.json
          push-to-registry: true
