name: compliance
description: "Generates SBOMs and gates on their BSI TR-03183-2 v2 conformance score (sbomqs)"

inputs:
  repo-threshold:
    description: "Minimum BSI v2 required-elements score for a repo (source) SBOM"
    required: false
    # Repo scans carry no licences (scalibr's language extractors don't extract
    # them), so this surface is capped lower by design — BSI permits omitting an
    # unavailable field. Raise only if other required fields improve.
    default: "4.5"
  os-threshold:
    description: "Minimum BSI v2 required-elements score for an OS SBOM"
    required: false
    # OS scans carry apk/rpm licences, so this surface clears a higher bar.
    # Current baseline ~7.4; ratchet up as further gaps close.
    default: "7.0"
  sbomqs-version:
    description: "Pinned sbomqs version to install"
    required: false
    default: "v1.3.0"

runs:
  using: composite
  steps:
    - name: Install sbomqs (pinned)
      shell: bash
      env:
        SBOMQS_VERSION: ${{ inputs.sbomqs-version }}
      run: go install "github.com/interlynk-io/sbomqs@${SBOMQS_VERSION}"
    - name: Build kunnus
      shell: bash
      run: go build -o /tmp/kunnus ./cmd/kunnus
    - name: Check BSI TR-03183-2 v2 conformance
      shell: bash
      env:
        REPO_THRESHOLD: ${{ inputs.repo-threshold }}
        OS_THRESHOLD: ${{ inputs.os-threshold }}
      run: |
        set -euo pipefail

        # gate <label> <sbom-file> <threshold>
        gate() {
          local label="$1" file="$2" threshold="$3"
          echo "::group::BSI v2 conformance — ${label}"
          sbomqs compliance --bsi-v2 "$file" || true
          echo "::endgroup::"
          sbomqs compliance --bsi-v2 --json "$file" > "${file}.bsi.json"
          local required total
          required=$(jq -r '.summary.required_elements_score' "${file}.bsi.json")
          total=$(jq -r '.summary.total_score' "${file}.bsi.json")
          printf '%s: required=%.2f (threshold %s), total=%.2f\n' "$label" "$required" "$threshold" "$total"
          if ! awk -v s="$required" -v t="$threshold" 'BEGIN { exit !(s+0 >= t+0) }'; then
            echo "::error::${label} BSI v2 required-elements score ${required} is below ${threshold}"
            return 1
          fi
        }

        # The ecosystem corpus exercises every language ecosystem in one scan;
        # the alpine fixture exercises OS packages with apk licences.
        /tmp/kunnus sbom repo testdata/ecosystems -o /tmp/repo.cdx.json
        /tmp/kunnus sbom os --target-os linux testdata/osfamilies/alpine -o /tmp/os.cdx.json

        rc=0
        gate "repo" /tmp/repo.cdx.json "$REPO_THRESHOLD" || rc=1
        gate "os" /tmp/os.cdx.json "$OS_THRESHOLD" || rc=1
        exit "$rc"
