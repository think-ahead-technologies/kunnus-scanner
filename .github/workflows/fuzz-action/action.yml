name: fuzz
description: "Runs each Go fuzz target for a short bounded time to catch crashers"

runs:
  using: composite
  steps:
    - name: Run fuzz targets
      shell: bash
      # Short per-target bound: this is a smoke test for crashers plus a brief
      # exploration, not an exhaustive campaign. Each target's seed corpus also
      # runs in the main unit-test job, so this job's added value is the active
      # mutation. Run `make fuzz FUZZTIME=5m` locally to hunt harder.
      run: make fuzz FUZZTIME=10s
