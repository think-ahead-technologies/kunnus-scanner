name: Dependencies

# Tracks osv-scalibr's upstream HEAD (it cuts tagged releases rarely, and v2 is
# built directly on it) and opens a PR with the bump. The PR's own checks.yml
# run is the authoritative gate; the in-workflow build+test here only decides
# whether to open the PR as a ready review or a draft, and captures the errors
# when scalibr's HEAD breaks an API we depend on.

on:
  schedule:
    # weekly on Mondays at 06:47 UTC
    - cron: "47 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Restrict jobs in this workflow to have no permissions by default; permissions
# should be granted per job as needed using a dedicated `permissions` block
permissions: {}

jobs:
  update:
    permissions:
      contents: read # checkout only; the scoped app token does the writing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          check-latest: true
          # Every run pulls a fresh scalibr commit, so the build cache is near
          # useless here; disabling it also sidesteps cache-poisoning concerns.
          cache: false
      - name: Bump osv-scalibr to upstream HEAD
        id: update
        run: ./scripts/bump-scalibr.sh
      - name: Build and test
        id: verify
        # Honest signal: capture the build+test result instead of swallowing it
        # with `|| true`. The outcome drives the draft flag and the PR body below.
        run: ./scripts/verify-build.sh
      - name: Mint a repo-scoped app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          # No dedicated environment: this is an unattended scheduled bot, so an
          # environment's main lever — required reviewers — would defeat the
          # automation, and the same app credentials are used un-gated in
          # goreleaser.yml. Gating the app private key behind a branch-restricted
          # environment is a worthwhile repo-wide hardening task, but it belongs
          # to both workflows at once, not this PR.
          app-id: ${{ secrets.BOT_APP_ID }} # zizmor: ignore[secrets-outside-env]
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }} # zizmor: ignore[secrets-outside-env]
          # Scoped to this repo with only what opening the PR needs, rather than
          # inheriting all of the app installation's permissions.
          permission-contents: write
          permission-pull-requests: write
      - name: Open or update the bump PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          title: "feat: update osv-scalibr"
          body: |
            Bumps `osv-scalibr` to https://github.com/google/osv-scalibr/commit/${{ steps.update.outputs.commit }}

            **Build + tests:** ${{ steps.verify.outputs.ok == 'true' && '✅ green — ready to review' || '❌ broken by upstream changes — opened as a draft; the log below is your starting point' }}

            <details><summary>build/test output (last 40 lines)</summary>

            ```
            ${{ steps.verify.outputs.log }}
            ```

            </details>
          branch: "bot/update-scalibr"
          commit-message: "feat: update osv-scalibr to ${{ steps.update.outputs.commit }}"
          delete-branch: true
          # Broken bumps land as drafts so they can't be merged by accident; a
          # clean bump opens as a normal, review-ready PR.
          draft: ${{ steps.verify.outputs.ok != 'true' }}
